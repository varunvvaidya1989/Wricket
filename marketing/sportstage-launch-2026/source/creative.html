<script>
const params=new URLSearchParams(location.search);const assetBase='../assets/';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('campaign.json').then(r=>r.json()).then(data=>{
 const id=params.get('id')||'01-brand';const p=[...data.posts,...data.carousel].find(p=>p.id===id);if(!p)throw Error('Unknown creative '+id);
 const format=params.get('format')||'feed';const art=document.getElementById('art');art.className=format+' '+p.type;
 let visual='';
 if(p.type==='brand')visual='<div class="ring"><img class="brandmark" src="'+assetBase+'logo.png"></div>';
 if(p.type==='phone')visual='<div class="device"><img src="'+assetBase+(p.screen||'app-home.png')+'"></div><div class="device-note">'+esc(p.screenNote||'Current app screen')+'</div>';
 if(p.type==='rally')visual='<div class="rboard"><div class="rcard serve"><div><div class="rtag">● SERVING</div><div class="rname">Side A</div></div><div class="rpts">18</div></div><div class="rcard"><div><div class="rtag">RECEIVING</div><div class="rname">Side B</div></div><div class="rpts">17</div></div><div class="rmeta"><span>GAME 2 · ILLUSTRATIVE SCORE</span><b>↶ Undo</b></div></div>';
 if(p.type==='lab')visual='<div class="lab"><div class="labhead">WHERE YOU FINISH · ILLUSTRATIVE</div>'+[['Winners','Smash',72],['Net kills','Front court',54],['Drops','Rear court',38],['Errors forced','Mid court',46]].map(r=>'<div class="labrow"><div>'+r[0]+'<br><span>'+r[1]+'</span></div><div class="bar"><i style="width:'+r[2]+'%"></i></div><b>'+r[2]+'%</b></div>').join('')+'</div>';
 if(p.type==='bracket')visual='<div class="bracket"><div class="bcol"><div class="bm"><small>SEMI-FINAL 1</small><div class="w">Team North ✓</div><div>Team East</div></div><div class="bm"><small>SEMI-FINAL 2</small><div>Team West</div><div class="w">Team South ✓</div></div></div><div class="blink"></div><div class="champ"><small>CHAMPION</small><div>The road to the title.</div></div></div>';
 if(p.type==='sports')visual='<div class="list">'+['Cricket','Badminton','Tennis','Padel','Table tennis','Pickleball'].map((s,i)=>'<div class="sport"><b>0'+(i+1)+'</b>'+s+'</div>').join('')+'</div>';
 if(p.type==='workflow')visual='<div class="workflow">'+['Registrations','Fixture plan','Winning bracket','Sponsors'].map((s,i)=>'<div class="item"><b>0'+(i+1)+'</b><span>'+s+'</span><i>'+(i==1?'NEXT TASK':'✓')+'</i></div>').join('')+'</div>';
 if(p.type==='sponsors')visual='<div><div class="sponsor"><div class="mini">YOUR TOURNAMENT</div><div class="sponsor-title">TITLE SPONSOR</div><div class="sponsor-name">Your partner here.</div><div class="sponsor-meta">Name · Logo · Label · Website</div></div><div class="note">Illustrative placement</div></div>';
 if(p.type==='score')visual='<div class="scorecard"><div class="live"><span>● LIVE SCORE</span><span>BADMINTON</span></div><div class="scores"><div><div class="team">Side A</div><div class="points">18</div></div><div class="dash"></div><div><div class="team">Side B</div><div class="points">17</div></div></div><div class="note">Illustrative score · Demo match</div></div>';
 if(p.type==='steps')visual='<div class="step"><b>'+p.step+'</b><span>'+p.detail+'</span></div>';
 art.innerHTML=(p.image?'<img class="bg" src="'+assetBase+p.image+'"><div class="shade"></div>':'<div class="track"></div>')+'<header class="top"><div class="logo"><img src="'+assetBase+'logo.png"><span>Sport<span>Stage</span></span></div><span class="edition">EVERY SPORT. ONE STAGE.</span></header><section class="copy"><div class="category">'+esc(p.category)+'</div><h1>'+p.headline+'</h1><div class="body">'+esc(p.body)+'</div></section><div class="visual">'+visual+'</div><footer class="bottom"><div class="cta">'+esc(p.cta||data.cta)+' ↗</div><div class="index">SPORTSTAGE / '+(id.startsWith('carousel')?id.slice(-2)+' — 06':'MATCHDAY')+'</div></footer>';
 document.fonts.ready.then(()=>Promise.all([...document.images].map(img=>img.decode()))).then(()=>window.renderReady=true);
});
</script></body></html>
